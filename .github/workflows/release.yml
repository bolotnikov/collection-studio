name: macOS Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const {version} = JSON.parse(fs.readFileSync("package.json", "utf8")); if (process.env.RELEASE_TAG !== `v${version}`) throw new Error("Tag must match package.json version"); fs.accessSync(`docs/releases/v${version}.md`);'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --maxWorkers=2 --testTimeout=20000
      - run: npm run package:mac
      - name: Verify release checksum
        working-directory: release
        run: shasum -a 256 -c SHA256SUMS.txt
      - name: Publish verified release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/Collection-Studio-mac-universal.zip \
            release/SHA256SUMS.txt \
            --verify-tag \
            --title "Collection Studio ${RELEASE_TAG#v} · macOS Universal" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            --draft
          gh release view "$RELEASE_TAG" --json assets \
            --jq '[.assets[].name] | sort' > "$RUNNER_TEMP/release-assets.json"
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.deepEqual(JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/release-assets.json`, "utf8")), ["Collection-Studio-mac-universal.zip", "SHA256SUMS.txt"]);'
          gh release edit "$RELEASE_TAG" --draft=false --latest
